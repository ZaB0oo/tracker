# Builds the desktop installers on every version tag (v1.8.0, …) and uploads
# them (plus the latest*.yml files electron-updater needs) to a DRAFT GitHub
# release: check the assets, write the notes, publish.
name: release

on:
  push:
    tags: ["v*"]
  # manual fallback: GitHub sometimes drops the push event for a tag that was
  # deleted and recreated. Actions tab -> release -> Run workflow -> tag name.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v1.9.2)"
        required: true

# electron-builder creates the draft release and uploads the installers:
# the default workflow token is read-only, write access must be granted
permissions:
  contents: write

jobs:
  # The draft release must exist BEFORE the parallel builds start, otherwise
  # each OS job races to create its own draft and the assets end up split.
  draft:
    runs-on: ubuntu-latest
    steps:
      - run: >
          gh release create "$TAG" --draft
          --repo "$GITHUB_REPOSITORY" --title "${TAG#v}"
          --notes "Draft — notes added before publishing." || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # manual run: build the tagged commit, not the branch head
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # unsigned macOS build: skip the code-signing discovery
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
